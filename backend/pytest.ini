[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
; asyncio_default_fixture_loop_scope = function


addopts =
    -v
    --strict-markers
    --tb=short




