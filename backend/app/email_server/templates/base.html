<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f7; color: #51545e; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; background-color: #ffffff; border-radius: 8px; }
    .header { text-align: center; padding-bottom: 20px; border-bottom: 1px solid #eaeaec; }
    .content { padding: 20px 0; }
    .footer { text-align: center; font-size: 12px; color: #6b6e76; padding-top: 20px; border-top: 1px solid #eaeaec; }
    .button { background-color: #22bc66; color: #ffffff; padding: 10px 20px; text-decoration: none; border-radius: 4px; display: inline-block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>{{ store_name }}</h2>
    </div>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      <p>&copy; {{ current_year }} {{ store_name }}. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
