x-app-env: &app-env
  DATABASE_URL: mysql+asyncmy://db_user:db_password@db:3306/by_direct_db
  REDIS_URL: redis://redis:6379/0          # API, worker and beat share the same Redis and Database instance



services:
  # MySQL Database: Stores persistent relational data for users, orders, and products
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: by_direct_db
      MYSQL_USER: db_user
      MYSQL_PASSWORD: db_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis: Acts as the message broker and result backend for Celery background tasks
  redis:
    image: redis:alpine
    container_name: redis_broker
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Alembic Migration: Automatically runs database schema migrations before the API starts
  alembic:
    build: .
    container_name: alembic_migration
    command: alembic upgrade head
    env_file: .env                                # secrets, SMTP, Stripe, Cloudinary...
    environment: *app-env                         # ...then the container hosts override .env
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    container_name: by_direct_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully

  # Celery Worker: Processes asynchronous tasks (emails, background orders, analytics)
  celery:
    build: .
    container_name: celery_worker
    command: celery -A app.workers.celery_config:celery_app worker --loglevel=INFO
    volumes:
      - .:/app
    env_file: .env
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully


  # Celery Beat: Manages cron/periodic schedules defined inside your worker configuration
  celery_beat:
    build: .
    container_name: celery_beat
    command: celery -A app.workers.celery_config:celery_app beat --loglevel=INFO
    volumes:
      - .:/app
    env_file: .env
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully

  # Pytest Runner: Executes your test suite inside an isolated container context
  pytest:
    build: .
    container_name: pytest
    profiles: ["test"]                            # only runs with: docker compose --profile test run --rm pytest
    command: python -m pytest
    volumes:
      - .:/app
    env_file: .env
    environment:
      <<: *app-env
      TEST_DATABASE_URL: sqlite+aiosqlite:///./bydirect_tesddb.db   # use whatever your conftest expects
      TEST_REDIS_URL: redis://redis:6379/15
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mysql_data:
    
