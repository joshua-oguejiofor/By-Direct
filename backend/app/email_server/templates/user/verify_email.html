{% extends "base.html" %}

{% block content %}

  <h3>Verify Your Email Address</h3>
  <p>Welcome,</p>
  <p>Thank you for signing up! click the verification code below to complete your registration:</p>
  
  <div style="text-align: center; margin: 30px 0;">
    <span style="font-size: 28px; font-weight: bold; letter-spacing: 5px; background: #f0f0f5; padding: 10px 20px; border-radius: 5px;">
      <button type="button"><a href="{{ verify_link }}"
       style="display: inline-block; padding: 10px 20px; background-color: #95d297;
              color: #ffffff; text-decoration: none; border-radius: 4px;">Click Here</a></button>
    </span>
  </div>

  <p>This code will expire in {{ expire }} hour.</p>
  <p>If you did not request this email, please ignore it.</p>
{% endblock %}
